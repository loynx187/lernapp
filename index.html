<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Lernapp" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>Lernapp</title>
    <script>
      // Darstellung vor dem ersten Zeichnen setzen (die fertige Fassung speichert src/lib/theme.ts), damit nichts aufblitzt.
      ;(function () {
        var root = document.documentElement
        var dark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches
        root.dataset.theme = 'standard'
        root.dataset.scheme = dark ? 'dark' : 'light'
        try {
          var d = JSON.parse(localStorage.getItem('lernapp-darstellung') || 'null')
          var b = d && d.boot && d.boot[dark ? 'dark' : 'light']
          if (!b) {
            // Gespeichert von App 1.29.0 (ohne fertige Fassung)
            if (d && (d.theme === 'papier' || d.theme === 'graphit')) root.dataset.theme = d.theme
            if (d && (d.appearance === 'light' || d.appearance === 'dark')) root.dataset.scheme = d.appearance
            return
          }
          root.dataset.theme = d.theme
          root.dataset.scheme = b.scheme
          if (b.doodles) root.dataset.doodles = b.doodles
          for (var k in b.vars) root.style.setProperty(k, b.vars[k])
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
